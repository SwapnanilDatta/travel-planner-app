{% extends 'base.html' %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<div class="container mt-5" x-data="itineraryPlanner()">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <h6 class="text-uppercase text-muted-editorial letter-spacing-wide mb-2 text-center">Establish Route</h6>
            <h2 class="display-4 font-weight-bold mb-5 text-center" style="font-family: var(--font-heading);">Plan Itinerary for {{ group.name }}</h2>

            <div x-show="!result" class="card card-editorial border-0">
                <div class="card-body p-0">
                    <form @submit.prevent="submitForm" class="editorial-form">
                        {% csrf_token %}
                        <div class="row mb-4 g-4">
                            <div class="col-md-6">
                                <label class="form-label text-uppercase small text-muted-editorial">Destinations (comma-separated)</label>
                                <input type="text" class="form-control border-editorial rounded-0 py-2" x-model="destinationsInput"
                                    placeholder="e.g. Delhi, Agra" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-uppercase small text-muted-editorial">Total Days</label>
                                <input type="number" class="form-control border-editorial rounded-0 py-2" x-model="payload.total_days" min="1" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-uppercase small text-muted-editorial">Group Size</label>
                                <input type="number" class="form-control border-editorial rounded-0 py-2" x-model="payload.group_size" min="1" required>
                            </div>
                        </div>

                        <div class="row mb-5 g-4">
                            <div class="col-md-4">
                                <label class="form-label text-uppercase small text-muted-editorial">Budget Per Day (INR)</label>
                                <select class="form-select border-editorial rounded-0 py-2" x-model="payload.budget_per_day_INR" required>
                                    <option value="Under 500">Under 500</option>
                                    <option value="500-1500">500-1500</option>
                                    <option value="1500-3000">1500-3000</option>
                                    <option value="3000+">3000+</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-uppercase small text-muted-editorial">Budget Type</label>
                                <select class="form-select border-editorial rounded-0 py-2" x-model="payload.budget_type" required>
                                    <option value="per_person">Per Person</option>
                                    <option value="per_group">Per Group</option>
                                </select>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <div class="form-check mb-2">
                                    <input class="form-check-input rounded-0 border-dark" type="checkbox" x-model="payload.use_llm" id="useLlm">
                                    <label class="form-check-label text-uppercase small" for="useLlm">
                                        Use LLM Enhancement
                                    </label>
                                </div>
                            </div>
                        </div>

                        <hr class="mb-5" style="border-top: 1px solid var(--border-color);">
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 style="font-family: var(--font-heading);">Travelers Overview</h3>
                            <button type="button" class="btn btn-sm btn-editorial-outline" @click="addMember">+ Add Traveler</button>
                        </div>

                        <div class="row g-4">
                            <template x-for="(member, index) in payload.members" :key="index">
                                <div class="col-md-12">
                                    <div class="card card-editorial border-editorial mb-0">
                                        <div class="card-body p-4">
                                            <div class="d-flex justify-content-between align-items-center mb-4" style="border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                                                <h5 class="mb-0" style="font-family: var(--font-heading);">Traveler <span x-text="index + 1"></span></h5>
                                                <button type="button" class="btn btn-sm btn-outline-danger rounded-0" @click="removeMember(index)"
                                                    x-show="payload.members.length > 1">Remove</button>
                                            </div>
                                            <div class="row mb-4 g-3">
                                                <div class="col-md-4">
                                                    <label class="form-label text-uppercase small text-muted-editorial">Name</label>
                                                    <input type="text" class="form-control border-editorial rounded-0 py-2" x-model="member.name" required>
                                                </div>
                                                <div class="col-md-4">
                                                    <label class="form-label text-uppercase small text-muted-editorial">Age Group</label>
                                                    <input type="text" class="form-control border-editorial rounded-0 py-2" x-model="member.age_group" placeholder="e.g. 25-35" required>
                                                </div>
                                                <div class="col-md-4 d-flex align-items-end">
                                                    <div class="form-check mb-2">
                                                        <input class="form-check-input rounded-0 border-dark" type="checkbox"
                                                            x-model="member.mobility_constraints">
                                                        <label class="form-check-label text-uppercase small">Mobility Issues</label>
                                                    </div>
                                                </div>
                                            </div>

                                            <h6 class="text-uppercase small text-muted-editorial mb-3">Preferences</h6>
                                            <div class="row g-2">
                                                <template x-for="(pref, pIndex) in member.preferences" :key="pIndex">
                                                    <div class="col-md-4 mb-2 d-flex">
                                                        <input type="text" class="form-control border-editorial rounded-0 py-1"
                                                            x-model="member.preferences[pIndex]">
                                                        <button type="button" class="btn btn-sm btn-outline-danger ms-2 rounded-0" @click="member.preferences.splice(pIndex, 1)">X</button>
                                                    </div>
                                                </template>
                                                <div class="col-12 mt-2">
                                                    <button type="button" class="btn btn-sm btn-editorial-outline" @click="member.preferences.push('')">+ Add Preference</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-editorial btn-lg py-3" :disabled="loading">
                                <span x-show="!loading" style="letter-spacing: 0.1em;">Generate Itinerary</span>
                                <span x-show="loading" style="letter-spacing: 0.1em;">Generating... This may take up to 3 minutes.</span>
                            </button>
                        </div>

                        <div x-show="error" class="alert alert-danger mt-4 rounded-0" x-text="error"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div x-show="result" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Generating Itinerary...</h3>
        </div>
        <div class="alert alert-info">
            Your itinerary has been generated and is being saved. You will be redirected shortly.
        </div>
    </div>
</div>

<script>
    const INITIAL_DATA = {{ initial_data_json| safe }};

    document.addEventListener('alpine:init', () => {
        Alpine.data('itineraryPlanner', () => {
            const initialData = INITIAL_DATA;
            return {
                destinationsInput: initialData.destinationsInput || '',
                payload: initialData.payload || {
                    destinations: [],
                    total_days: 1,
                    group_size: 1,
                    pace: "Moderate",
                    budget_per_day_INR: "1500-3000",
                    budget_type: "per_person",
                    use_llm: false,
                    members: []
                },
                loading: false,
                error: null,
                result: null,

                addMember() {
                    this.payload.members.push({
                        name: `Member ${this.payload.members.length + 1}`,
                        age_group: "25-35",
                        mobility_constraints: false,
                        preferences: ["nature", "photography", "history"]
                    });
                },
                removeMember(index) {
                    this.payload.members.splice(index, 1);
                },
                async submitForm() {
                    this.loading = true;
                    this.error = null;

                    // Clean up destinations
                    this.payload.destinations = this.destinationsInput.split(',').map(d => d.trim()).filter(d => d);

                    try {
                        const response = await fetch("{% url 'plan_itinerary' group.code %}", {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                            },
                            body: JSON.stringify(this.payload)
                        });

                        const data = await response.json();

                        if (response.ok) {
                            if (data.status === 'processing') {
                                this.pollStatus();
                            } else {
                                this.error = "Unexpected response from server.";
                                this.loading = false;
                            }
                        } else {
                            this.error = data.message || "Failed to start generating itinerary.";
                            this.loading = false;
                        }
                    } catch (err) {
                        this.error = "A network error occurred: " + err.message;
                        this.loading = false;
                    }
                },
                async pollStatus() {
                    try {
                        const response = await fetch(`/group/{{ group.code }}/plan/check-ready/`);
                        const data = await response.json();
                        
                        if (response.ok) {
                            if (data.status === 'completed') {
                                this.result = true;
                                window.location.href = data.redirect_url;
                            } else if (data.status === 'failed') {
                                this.error = "Failed to generate itinerary: " + (data.error || "Unknown error");
                                this.loading = false;
                            } else {
                                // Still processing, poll again after 5 seconds
                                setTimeout(() => this.pollStatus(), 5000);
                            }
                        } else {
                            this.error = data.message || "Failed to check status.";
                            this.loading = false;
                        }
                    } catch (err) {
                        this.error = "A network error occurred while checking status: " + err.message;
                        this.loading = false;
                    }
                }
            }
        })
    })
</script>
{% endblock %}
