{% extends 'base.html' %}


{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Create Trip for {{ group.name }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Save Trip</button>
                        <a href="{% url 'group_detail' group.code %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const apiKey = '{{ opencage_api_key }}';
    
    function setupAutocomplete(inputId, datalistId) {
        const input = document.getElementById(inputId);
        if (!input) return;
        
        // Create datalist element
        const datalist = document.createElement('datalist');
        datalist.id = datalistId;
        document.body.appendChild(datalist);
        input.setAttribute('list', datalistId);
        
        let timeout = null;
        input.addEventListener('input', function() {
            clearTimeout(timeout);
            const query = this.value;
            if (query.length < 3) return;
            
            timeout = setTimeout(() => {
                // If hotel, we might want to prioritize POIs or the selected city, but for simplicity, general search
                fetch(`https://api.opencagedata.com/geocode/v1/json?q=${encodeURIComponent(query)}&key=${apiKey}&limit=5`)
                    .then(response => response.json())
                    .then(data => {
                        datalist.innerHTML = '';
                        if (data.results) {
                            data.results.forEach(result => {
                                const option = document.createElement('option');
                                option.value = result.formatted;
                                datalist.appendChild(option);
                            });
                        }
                    });
            }, 300); // 300ms debounce
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        setupAutocomplete('id_destination_city', 'city-list');
        setupAutocomplete('id_hotel_name', 'hotel-list');
    });
</script>
{% endblock %}
