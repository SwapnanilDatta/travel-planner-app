{% extends 'base.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <h6 class="text-uppercase text-muted-editorial letter-spacing-wide mb-2 text-center">Traveler Input</h6>
        <h1 class="display-4 font-weight-bold mb-5 text-center" style="font-family: var(--font-heading);">Submit Preferences</h1>
        
        <div class="card card-editorial border-0">
            <div class="card-body p-0">
                <form method="post" x-data="preferenceForm()" class="editorial-form">
                    {% csrf_token %}
                    
                    <div class="mb-5">
                        {{ form.as_p }}
                    </div>
                    
                    <hr class="mb-5" style="border-top: 1px solid var(--border-color);">
                    <h3 class="mb-2" style="font-family: var(--font-heading);">Specific Interests</h3>
                    <p class="text-muted-editorial mb-4">Add your interests (e.g., Nature, History, Food).</p>
                    
                    <div class="mb-4">
                        <template x-for="(pref, index) in preferences" :key="index">
                            <div class="row mb-3 align-items-center g-2">
                                <div class="col-md-10">
                                    <input type="text" class="form-control border-editorial rounded-0 py-2" x-model="pref.name" placeholder="Interest (e.g. Photography)" required>
                                </div>
                                <div class="col-md-2 text-end">
                                    <button type="button" class="btn btn-outline-danger rounded-0" @click="removePreference(index)">X</button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <button type="button" class="btn btn-editorial-outline btn-sm mb-5" @click="addPreference()">+ Add Preference</button>
                    
                    <input type="hidden" name="category_votes" :value="JSON.stringify(getCategoryVotes())">

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-editorial px-5 py-3">Save Preferences</button>
                        <a href="{% url 'group_detail' group.code %}" class="btn btn-editorial-outline px-4 py-3">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const INITIAL_VOTES = {{ initial_votes_json|safe }};
    document.addEventListener('alpine:init', () => {
        Alpine.data('preferenceForm', () => {
            const initialVotes = INITIAL_VOTES || [];
            const initialPrefs = [];
            
            if (Array.isArray(initialVotes)) {
                initialVotes.forEach(v => initialPrefs.push({name: v}));
            } else {
                for (const [key, value] of Object.entries(initialVotes)) {
                    initialPrefs.push({name: key});
                }
            }
            
            if (initialPrefs.length === 0) {
                initialPrefs.push({name: ''});
            }
            return {
                preferences: initialPrefs,
                addPreference() {
                    this.preferences.push({name: ''});
                },
                removePreference(index) {
                    this.preferences.splice(index, 1);
                },
                getCategoryVotes() {
                    const votes = [];
                    this.preferences.forEach(p => {
                        if (p.name.trim() !== '') {
                            votes.push(p.name.trim());
                        }
                    });
                    return votes;
                }
            }
        });
    });
</script>
{% endblock %}
