{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Login</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>
                <div class="mt-3 text-center">
                    <small class="text-muted">Need an account? <a href="{% url 'register' %}">Sign Up Now</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
