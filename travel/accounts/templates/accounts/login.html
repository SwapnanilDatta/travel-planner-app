{% extends 'base.html' %}
{% block content %}
<div class="row g-0 align-items-center mt-5 card-editorial border-0">
    <div class="col-md-6 d-none d-md-block">
        <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=800&q=80" alt="Travel" class="img-fluid w-100" style="object-fit: cover; height: 600px;">
    </div>
    <div class="col-md-6 p-5">
        <div class="px-md-5">
            <h1 class="mb-2" style="font-family: var(--font-heading); font-size: 3rem;">Welcome Back</h1>
            <p class="text-muted-editorial mb-5">Enter your details to access your itineraries.</p>
            
            <form method="POST" class="editorial-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-editorial w-100 mt-4 py-3" type="submit">Sign In</button>
            </form>
            <div class="mt-5 text-center">
                <p class="text-muted-editorial small">Need an account? <a href="{% url 'register' %}" class="text-primary-editorial fw-bold text-decoration-none">Create one</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
