{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-8">
        <h6 class="text-uppercase text-muted-editorial letter-spacing-wide mb-2 text-center">Live Discussion</h6>
        <h1 class="display-4 font-weight-bold mb-5 text-center" style="font-family: var(--font-heading);">{{ group.name }}</h1>
        
        <div class="card card-editorial border-editorial mb-5">
            <div class="card-header bg-transparent border-bottom border-dark py-3 d-flex justify-content-between align-items-center">
                <span class="text-uppercase small fw-bold" style="letter-spacing: 0.1em;">Message Board</span>
                <span class="text-muted-editorial small">Code: {{ group.code }}</span>
            </div>
            <div class="card-body chat-box" id="chat-log" style="height: 500px; overflow-y: auto; background-color: var(--surface-color);">
                {% for message in messages_list %}
                    <div class="mb-3">
                        <strong class="text-uppercase small" style="letter-spacing: 0.05em; border-bottom: 1px solid var(--accent-color);">{{ message.sender.username }}</strong><br>
                        <span class="fs-6 mt-1 d-inline-block">{{ message.content }}</span>
                    </div>
                {% endfor %}
            </div>
            <div class="card-footer bg-transparent border-top border-dark p-3">
                <div class="input-group">
                    <input type="text" id="chat-message-input" class="form-control border-editorial rounded-0 py-2" placeholder="Type your message here...">
                    <button class="btn btn-editorial px-4" id="chat-message-submit" type="button">Send</button>
                </div>
            </div>
        </div>
        <div class="text-center">
            <a href="{% url 'group_detail' group.code %}" class="btn btn-editorial-outline">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const groupCode = "{{ group.code }}";
    const currentUsername = "{{ user.username }}";
    
    // Connect to WebSocket
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const chatSocket = new WebSocket(
        protocol + window.location.host + '/ws/chat/' + groupCode + '/'
    );

    const chatLog = document.querySelector('#chat-log');
    chatLog.scrollTop = chatLog.scrollHeight; // Scroll to bottom initially

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const messageElement = document.createElement('div');
        messageElement.className = 'mb-2';
        
        // Basic escaping could be added here, but textContent handles it safely
        const strong = document.createElement('strong');
        strong.textContent = data.username + ': ';
        const span = document.createElement('span');
        span.textContent = data.message;
        
        messageElement.appendChild(strong);
        messageElement.appendChild(span);
        chatLog.appendChild(messageElement);
        
        chatLog.scrollTop = chatLog.scrollHeight; // Scroll to bottom
    };

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

    document.querySelector('#chat-message-input').focus();
    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.keyCode === 13) {  // enter, return
            document.querySelector('#chat-message-submit').click();
        }
    };

    document.querySelector('#chat-message-submit').onclick = function(e) {
        const messageInputDom = document.querySelector('#chat-message-input');
        const message = messageInputDom.value;
        if(message.trim() !== '') {
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            messageInputDom.value = '';
        }
    };
</script>
{% endblock %}
